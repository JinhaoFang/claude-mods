name: Mod proposal / mod 提案
description: Propose a mod for the marketplace / 推荐一个 mod 加入 marketplace
title: "[Mod] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a mod before it is adopted. Check the inclusion bar first — see CONTRIBUTING.md.
        采用前请先提案，并先确认符合收录标准 —— 见 CONTRIBUTING.md。
  - type: input
    id: mod-name
    attributes:
      label: Mod name / mod 名称
      description: The plugin name as it would appear in the catalog. / 将出现在目录中的插件名。
    validations:
      required: true
  - type: textarea
    id: what-it-does
    attributes:
      label: What it does / 功能简介
      description: What the mod does and which events it handles. / mod 做什么，处理哪些事件。
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: First-party or third-party / 第一方还是第三方
      description: Authored in this repo, or adopted from another project? / 本仓库原创，还是从其他项目收录？
      options:
        - First-party (authored here) / 第一方（本仓库原创）
        - Third-party (adopted from upstream) / 第三方（从上游收录）
    validations:
      required: true
  - type: input
    id: upstream-url
    attributes:
      label: Upstream repository URL / 上游仓库地址
      description: Third-party only — the source repository. Write "n/a" for a first-party mod. / 仅第三方：源码仓库地址；第一方填 "n/a"。
      placeholder: https://github.com/owner/repo
    validations:
      required: false
  - type: input
    id: license
    attributes:
      label: License (third-party) / 许可证（第三方）
      description: The upstream license name (e.g. MIT, Apache-2.0); it must be on the allowlist. Write "n/a" for a first-party mod. / 上游许可证名称（如 MIT、Apache-2.0），须在允许清单内；第一方填 "n/a"。
      placeholder: MIT
    validations:
      required: false
  - type: textarea
    id: reputation
    attributes:
      label: Community-adoption evidence (third-party) / 社区采用证据（第三方）
      description: Independent forks, downstream packaging (Nix, Homebrew, dotfiles), third-party evaluations, distribution counts, and the mod's own issue traffic. Also give stars and repository age — the floor is ≥100 stars or ≥14 days old, which is a floor, not a substitute for evidence; host-repository stars are not a signal. Write "n/a" for a first-party mod. / 独立 fork、下游打包（Nix、Homebrew、dotfiles）、第三方评测、分发量与 mod 自己的 issue 动态。同时给出星标数与仓库年龄 —— 门槛为 ≥100 星或 ≥14 天，它只是门槛而非证据的替代；宿主仓库的星标不是信号。第一方填 "n/a"。
      placeholder: e.g. packaged in nixpkgs; 3 independent forks; 420 stars, 8 months old
    validations:
      required: false
